<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Tivy</title>
    <link rel="icon" href="../favicon.png" />
    <style>
      @font-face {
        font-family: Outfit;
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(../outfit.woff2) format('woff2');
      }
      :root {
        --background: #0b0d12;
        --surface: #151821;
        --line: #272c38;
        --text: #f4f5f7;
        --muted: #a3a8b4;
        --accent: #e8b04b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Outfit, system-ui, sans-serif;
        font-size: 18px;
        line-height: 1.4;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      header img {
        height: 44px;
        width: auto;
        margin-left: -8px;
      }
      h1 {
        font-size: 30px;
        margin: 8px 0 20px;
      }
      .kinds {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .kinds button {
        flex: 1;
        padding: 12px 8px;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 16px;
      }
      .kinds button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--text);
      }
      label {
        display: block;
        margin-bottom: 16px;
        font-size: 16px;
        color: var(--muted);
      }
      input,
      textarea {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      small {
        display: block;
        margin-top: 4px;
      }
      #send {
        width: 100%;
        padding: 16px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #14161c;
        font: inherit;
        font-weight: 700;
        font-size: 20px;
      }
      #send:disabled {
        opacity: 0.6;
      }
      .status {
        min-height: 1.4em;
        margin: 16px 0;
        color: var(--accent);
      }
      .status.done {
        font-size: 26px;
        font-weight: 700;
        color: var(--text);
      }
      .privacy {
        color: var(--muted);
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <header><img src="../logo.png" alt="Tivy" /></header>
      <h1 data-text="title">Invia alla TV</h1>
      <form id="form" autocomplete="off" novalidate>
        <div class="kinds">
          <button type="button" data-kind="xtream" aria-pressed="true" data-text="kindXtream">
            Nome utente e password
          </button>
          <button
            type="button"
            data-kind="playlistUrl"
            aria-pressed="false"
            data-text="kindPlaylistUrl"
          >
            Lista da link
          </button>
        </div>
        <div data-for="xtream">
          <label><span data-text="message"></span><textarea id="message"></textarea></label>
          <label
            ><span data-text="server"></span
            ><input
              id="server"
              type="url"
              inputmode="url"
              autocapitalize="none"
              spellcheck="false"
              placeholder="http://esempio.it:8080" />
            <small data-text="serverHelp"></small
          ></label>
          <label
            ><span data-text="username"></span
            ><input id="username" autocapitalize="none" spellcheck="false"
          /></label>
          <label
            ><span data-text="password"></span
            ><input id="password" type="password" autocapitalize="none" spellcheck="false"
          /></label>
          <label><span data-text="name"></span><input id="name" /></label>
        </div>
        <div data-for="playlistUrl" hidden>
          <label
            ><span data-text="url"></span
            ><input
              id="url"
              type="url"
              inputmode="url"
              autocapitalize="none"
              spellcheck="false"
              placeholder="https://esempio.it/lista.m3u"
          /></label>
          <label><span data-text="name"></span><input id="listName" /></label>
        </div>
        <button id="send" type="submit" data-text="send">Invia alla TV</button>
      </form>
      <p id="status" class="status" role="status"></p>
      <p class="privacy" data-text="privacy"></p>
    </main>
