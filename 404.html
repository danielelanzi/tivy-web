<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="robots" content="noindex" />
    <title>Tivy · Pagina non trovata</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        --background: #0b0d12;
        --surface-strong: #1d212c;
        --text: #f4f5f7;
        --muted: #a3a8b4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--background);
        color: var(--text);
        font-family: Outfit, system-ui, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main {
        max-width: 460px;
      }
      img {
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 6px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 24px;
      }
      a {
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        color: var(--text);
        background: var(--surface-strong);
      }
      a.primary {
        color: var(--background);
        background: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Tivy" />
      <h1>Questa pagina non c'è</h1>
      <p>L'indirizzo potrebbe essere sbagliato o la pagina è stata spostata.</p>
      <p lang="en">This page does not exist.</p>
      <div class="actions">
        <a class="primary" href="/">Scarica Tivy</a>
        <a href="/tv/">Apri Tivy nel browser</a>
      </div>
    </main>
  </body>
</html>
